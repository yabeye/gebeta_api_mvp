version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema:
      - "internal/db/migrations"
      - "internal/db/schema_stubs"
    gen:
      go:
        package: "sqlc"
        out: "internal/db/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"